spring.application.name=medsafe-backend
server.port=8080

# Datasource configuration
spring.datasource.url=jdbc:mysql://localhost:3306/medsafe?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD:${SPRING_DATASOURCE_PASSWORD}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA and Hibernate configuration
# Mode 'validate' guarantees existing database schema is never dropped or modified
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Drug Data Provider Configuration
# 'production' uses real RxNorm concept resolution + openFDA drug labeling
# 'development' is strictly reserved for automated mock development tests
medsafe.drug-data.provider=${DRUG_DATA_PROVIDER:production}

# NLM RxNorm Configuration
medsafe.rxnorm.base-url=${RXNORM_BASE_URL:https://rxnav.nlm.nih.gov/REST}
medsafe.rxnorm.connect-timeout-ms=3000
medsafe.rxnorm.read-timeout-ms=5000

# FDA / openFDA Drug Labeling Configuration
medsafe.openfda.base-url=${OPENFDA_BASE_URL:https://api.fda.gov/drug/label.json}
medsafe.openfda.api-key=${OPENFDA_API_KEY:}
medsafe.openfda.connect-timeout-ms=3000
medsafe.openfda.read-timeout-ms=5000

